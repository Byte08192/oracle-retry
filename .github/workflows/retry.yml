name: Prova macchina Oracle
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"
permissions:
  actions: write
concurrency:
  group: oracle-retry
  cancel-in-progress: false
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa OCI CLI
        run: pip install oci-cli
      - name: Configura credenziali
        env:
          OCI_KEY: ${{ secrets.OCI_KEY }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_KEY" > ~/.oci/key.pem
          chmod 600 ~/.oci/key.pem
          cat > ~/.oci/config <<EOF
          [DEFAULT]
          user=${{ secrets.OCI_USER }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          tenancy=${{ secrets.OCI_TENANCY }}
          region=eu-milan-1
          key_file=~/.oci/key.pem
          EOF
          chmod 600 ~/.oci/config
      - name: Prova finche non trova la macchina
        env:
          TENANCY: ${{ secrets.OCI_TENANCY }}
          NTFY: ntfy.sh/minecraft-andrea-x7k29q
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e +o pipefail
          echo "ssh-rsa  ssh-key-2026-11-11" > key.pub

          AD=$(oci iam availability-domain list --compartment-id "$TENANCY" --query 'data[0].name' --raw-output 2>/dev/null)
          SUBNET=$(oci network subnet list --compartment-id "$TENANCY" --all --query 'data[?"prohibit-public-ip-on-vnic"==`false`] | [0].id' --raw-output 2>/dev/null)
          IMG=$(oci compute image list --compartment-id "$TENANCY" --operating-system "Canonical Ubuntu" --operating-system-version "24.04" --shape VM.Standard.A1.Flex --sort-by TIMECREATED --sort-order DESC --all --query 'data[?!contains("display-name", `Minimal`)] | [0].id' --raw-output 2>/dev/null)
          echo "AD: $AD"
          echo "Subnet: $SUBNET"
          echo "Immagine: $IMG"
          if [ -z "$AD" ] || [ -z "$SUBNET" ] || [ -z "$IMG" ]; then
            echo "Manca qualcosa (rete o immagine), script fermato"
            curl -s -H "Title: Script Oracle fermo" -d "Manca subnet o immagine, controlla GitHub" "$NTFY"
            exit 1
          fi

          FINE=$(( $(date +%s) + 19800 ))
          n=0
          errori=0
          while [ "$(date +%s)" -lt "$FINE" ]; do
            COUNT=$(oci compute instance list --compartment-id "$TENANCY" --lifecycle-state RUNNING --all --query 'length(data)' --raw-output 2>/dev/null)
            case "$COUNT" in ''|*[!0-9]*) COUNT=0 ;; esac
            if [ "$COUNT" -gt 0 ]; then echo "La macchina esiste gia, fine."; exit 0; fi

            n=$((n+1))
            echo "Tentativo $n - $(date +%H:%M:%S)"
            ID=$(oci compute instance launch --availability-domain "$AD" --compartment-id "$TENANCY" \
              --shape VM.Standard.A1.Flex --shape-config '{"ocpus":2,"memoryInGBs":12}' \
              --image-id "$IMG" --subnet-id "$SUBNET" \
              --assign-public-ip true --display-name minecraft --ssh-authorized-keys-file key.pub \
              --query 'data.id' --raw-output 2>/tmp/err)

            if [ -n "$ID" ]; then
              echo ">>> MACCHINA CREATA! <<<"
              curl -s -H "Title: Server Minecraft" -H "Priority: high" -d "MACCHINA ORACLE CREATA! 2 OCPU / 12 GB" "$NTFY"
              exit 0
            fi

            if grep -qi "capacity" /tmp/err; then
              echo "Out of capacity"; errori=0
            elif grep -qiE "TooManyRequests|429" /tmp/err; then
              echo "Troppe richieste, aspetto un minuto"; sleep 60
            else
              errori=$((errori+1))
              echo "Errore ($errori/10):"; grep -E '"code"|"message"' /tmp/err | head -3
              if [ "$errori" -ge 10 ]; then
                curl -s -H "Title: Script Oracle fermo" -d "10 errori di fila, controlla GitHub" "$NTFY"
                exit 1
              fi
            fi
            sleep 30
          done

          echo "Turno finito, mi rilancio da solo"
          gh workflow run retry.yml --repo "$GITHUB_REPOSITORY"
